name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: "SagerNet/sing-box git tag"
        required: false
        default: "v1.12.11"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SING_BOX_VERSION_DEFAULT: v1.12.11

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=sing-box-${{ github.event.inputs.sing_box_version || 'v1.12.11' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SING_BOX_VERSION=${{ github.event.inputs.sing_box_version || env.SING_BOX_VERSION_DEFAULT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
